name: CI

# Se ejecuta en cada push a cualquier rama y en cada pull request.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-test:
    name: build · lint · e2e
    runs-on: ubuntu-latest

    # Base de datos efímera para los tests e2e (se descarta al terminar el job).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koliskit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koliskit_test?schema=public
      IP_HASH_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Lint
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

      - name: Build
        run: npm run build

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Tests e2e
        run: npm run test:e2e
