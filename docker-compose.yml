services:
  db:
    image: postgres:17-alpine
    container_name: koliskit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: koliskit
    ports:
      - '5434:5432'
    volumes:
      - koliskit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d koliskit']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  koliskit_pgdata:
